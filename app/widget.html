<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
    <link rel="stylesheet" href="./css/index.css">
  </head>
  <body>
    <div id="loader-overlay" class="hidden" role="status" aria-hidden="true">
      <div class="loader-card">
        <div class="spinner-wrap">
          <div class="spinner-track"></div>
          <div class="spinner-arc animate-spin"></div>
        </div>
        <p id="loader-text" class="loader-text">Saving license...</p>
      </div>
    </div>

    <form id="record-form" class="card" novalidate>
      <div class="card-accent-bar"></div>

      <div class="card-head">
        <h1 class="card-title">Trade License</h1>
        <p id="user-greeting" class="greeting">Hello!</p>
      </div>

      <div class="section-title"><span class="dot"></span><h2>License Details</h2><span class="line"></span></div>
      <div id="license-fields" class="grid"></div>

      <div class="section-title"><span class="dot"></span><h2>Company Address</h2><span class="line"></span></div>
      <div id="address-fields" class="grid"></div>

      <div class="btn-row">
        <button type="button" class="btn btn-secondary" onclick="ZOHO.CRM.UI.Popup.close()">Close</button>
        <button type="submit" class="btn btn-primary">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg>
          Save License
        </button>
      </div>
    </form>

    <div class="popup-overlay hidden" id="popup" data-status="" role="dialog" aria-modal="true">
      <div class="popup-card animate-slide-up">
        <div id="statusIcon" class="status-icon"></div>
        <h3 id="popupTitle" class="popup-title">Notification</h3>
        <p id="popupMessage" class="popup-message"></p>
        <button type="button" class="popup-close-btn" onclick="hidePopup()">Close</button>
      </div>
    </div>

    <script src="./js/app.js"></script>
  </body>
</html>
